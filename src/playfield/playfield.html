
<section class="playfield">
    <div class="playfield-header">
        <div class="player-section">
            <div class="players player">
                <img class="player-picture" />
                <p class="player-name">blue</p>
                <p class="player-points">0</p>
            </div>
            <div class="players opponent">
                <img class="opponent-picture" />
                <p class="opponent-name">Orange</p>
                <p class="opponent-points">5</p>
            </div>
        </div>
        <div class="current-player">
            <p class="current-player-name">Current player: </p>
            <img  class="current-player-picture" />
        </div>
        
        <div class="exit-play">
            <p class="board-size"></p>
            <a class="exit-btn"  data-link="/playfield">
            <img src="/public/pictureThemes/CodeVibes/exit.png" class="exit-icon" />
                              <span>Exit game</span> 
                  
            </a>
        </div>
    </div>
    
<div class="card-Field">

   
</div>


<div class="exit-modal" >
    <div class="exit-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="exit-modal-title">
        <p class="exit-modal__title" id="exit-modal-title">Are you sure you want to quit the game?</p>
        <div class="exit-modal__actions">
            <button type="button" class="exit-modal__btn exit-modal__btn--continue">Back to game</button>
            <button type="button" class="exit-modal__btn exit-modal__btn--abort" data-link="/options">Exit game</button>
        </div>
    </div>
</div>



<div class="gameOver-modal" hidden>


</div>


<div class="winner-modal" hidden>
    
</div>

</section>
